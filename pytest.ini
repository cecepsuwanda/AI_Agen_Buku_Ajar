[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default: seluruh suite hijau TANPA jaringan.
# Tes yang memanggil Ollama sungguhan ditandai @pytest.mark.live dan
# dijalankan secara opt-in:  pytest -m live
addopts =
    -m "not live"
    -q
    --strict-markers
    --tb=short

markers =
    live: memanggil Ollama sungguhan (butuh server berjalan; di-skip secara default)
    integration: pipeline penuh dengan ChatModel palsu (tetap tanpa jaringan)

filterwarnings =
    error::DeprecationWarning:app.*

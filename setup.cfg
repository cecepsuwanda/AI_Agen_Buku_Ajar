# =============================================================================
# Konfigurasi paket, lint, dan type-check.
# Dipakai setup.cfg (bukan pyproject.toml) karena project ini memakai
# pip + venv + requirements.txt.
# =============================================================================

[metadata]
name = ai-book-author
version = 0.1.0
description = AI Agent Buku Ajar — penulis buku ajar berbasis multi-LLM Ollama
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
python_requires = >=3.11,<3.13
packages =
    app
    domain
    agents
    models
    memory
install_requires =
    file: requirements.txt

[options.packages.find]
exclude =
    tests
    tests.*

# Setelah `pip install -e .`, tersedia alias `ai-book`.
# Tanpa instalasi, gunakan:  python -m app ...   (kanonik, lihat README)
[options.entry_points]
console_scripts =
    ai-book = app.cli:main

# -----------------------------------------------------------------------------
# flake8
# -----------------------------------------------------------------------------
[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude =
    .venv,
    .git,
    __pycache__,
    build,
    dist,
    state,
    output
per-file-ignores =
    # prompt adalah data, bukan kode
    tests/*:S101

# -----------------------------------------------------------------------------
# mypy
# -----------------------------------------------------------------------------
[mypy]
python_version = 3.11
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_untyped_defs = True

# Seluruh paket aplikasi lolos --strict penuh (lihat README). `memory/` ikut
# ketat karena ia satu-satunya penulis state: kesalahan tipe di sana tidak
# menghasilkan crash, melainkan berkas yang salah tulis. `app/` dan `models/`
# ikut ketat karena keduanya adalah batas sistem — tempat tipe SDK, tipe
# konfigurasi YAML, dan tipe domain bertemu, dan justru di sana kesalahan tipe
# paling mahal untuk ditemukan belakangan.
[mypy-domain.*]
strict = True

[mypy-agents.*]
strict = True

[mypy-memory.*]
strict = True

[mypy-app.*]
strict = True

[mypy-models.*]
strict = True

# SDK pihak ketiga tanpa tipe lengkap
[mypy-ollama.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-jsonlines.*]
ignore_missing_imports = True
